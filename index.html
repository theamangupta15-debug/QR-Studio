<!DOCTYPE html><html lang="en"><head>
<title>Welcome | QR Studio</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/main.js"></script>
</head><body data-page="welcome" class="welcome-page">
<header id="site-header"></header>
<main><div class="center">
<h1>Welcome to QR Studio</h1>
<p>Tell us your name and we'll get started.</p>
<form class="name-form" id="nameForm">
<input type="text" id="nameInput" placeholder="Your name" maxlength="30" aria-label="Your name" required autofocus>
<button class="btn" type="submit">Continue</button>
</form>
</div></main>
<footer>Created by Aman Gupta
<a href="https://github.com/theamangupta15-debug/" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i> GitHub</a>
<a href="https://www.linkedin.com/in/aman-gupta-0036a7277/" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin"></i> LinkedIn</a></footer>
<script>
var saved=localStorage.getItem('qr-name');
if(saved&&!location.search.includes('change'))location.replace('home.html');
document.getElementById('nameForm').addEventListener('submit',function(e){
  e.preventDefault();
  var n=document.getElementById('nameInput').value.trim();
  if(!n)return;
  localStorage.setItem('qr-name',n);location.href='home.html';
});
</script>
</body></html>
